name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Syntax check all JS
        run: |
          find . -name "*.js" -not -path "./node_modules/*" -print0 | xargs -0 -I{} node --check {}
      - name: Validate manifests / package
        run: |
          node -e "JSON.parse(require('fs').readFileSync('manifest.json','utf8')); JSON.parse(require('fs').readFileSync('package.json','utf8')); console.log('json ok')"
      - name: Ensure no local secret is committed
        run: test ! -e ark-ws-secret.txt
      - name: Bridge health smoke test
        run: |
          node server/bridge-server.js > /tmp/ark-bridge.log 2>&1 &
          PID=$!
          sleep 2
          curl -fsS http://127.0.0.1:9333/health
          kill $PID || true
