<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>Ark Web Panel</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #0d1117;
      color: #c9d1d9;
      padding: 16px;
    }
    h1 { font-size: 16px; color: #58a6ff; margin-bottom: 16px; }
    .btn {
      display: inline-block;
      padding: 8px 16px;
      margin: 4px;
      background: #21262d;
      border: 1px solid #30363d;
      border-radius: 6px;
      color: #c9d1d9;
      font-size: 13px;
      cursor: pointer;
    }
    .btn:hover { background: #30363d; border-color: #58a6ff; }
    .output {
      margin-top: 16px;
      padding: 12px;
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 6px;
      font-family: monospace;
      font-size: 12px;
      white-space: pre-wrap;
      max-height: 500px;
      overflow-y: auto;
    }
  </style>
</head>
<body>
  <h1>Ark Web Panel</h1>
  <button class="btn" id="getDomBtn">获取 DOM</button>
  <button class="btn" id="getPerfBtn">性能分析</button>
  <button class="btn" id="getVitalsBtn">Web Vitals</button>
  <button class="btn" id="screenshotBtn">截图</button>
  <button class="btn" id="getCookiesBtn">Cookies</button>
  <button class="btn" id="a11yBtn">A11y 检查</button>
  <button class="btn" id="seoBtn">SEO 检查</button>
  <div class="output" id="output">点击按钮开始分析...</div>
  <script src="devtools.js"></script>
</body>
</html>
